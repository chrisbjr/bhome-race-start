<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Race Start Reaction Timer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      position: relative;
      padding: 2vh;
      box-sizing: border-box;
      text-align: center;
    }

    .lights {
      display: flex;
      gap: 3vw;
      margin-bottom: 4vh;
      z-index: 2;
    }

    .light {
      width: 10vw;
      height: 10vw;
      max-width: 60px;
      max-height: 60px;
      min-width: 30px;
      min-height: 30px;
      border-radius: 50%;
      background-color: #440000;
      border: 2px solid #ff0000;
    }

    .light.on {
      background-color: red;
    }

    button, #reactionTime {
      font-size: 4vw;
      padding: 2vh 4vw;
      max-width: 90vw;
      z-index: 2;
    }

    #tapArea {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>
<h1 style="z-index: 2; font-size: 6vw;">Race Start Reaction Timer</h1>
<div class="lights" id="lights">
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
</div>
<button id="startButton" onclick="startSequence()">Start</button>
<div id="reactionTime"></div>
<div id="tapArea" onclick="registerReaction()" ontouchstart="registerReaction()"></div>

<script>
  const lights = document.querySelectorAll('.light');
  const startButton = document.getElementById('startButton');
  let startTime = 0;
  let waitingForTap = false;

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function startSequence() {
    startButton.style.display = 'none';
    lights.forEach(l => l.classList.remove('on'));
    document.getElementById('reactionTime').textContent = '';
    waitingForTap = false;

    // Turn on lights one by one with real-time gaps
    for (let i = 0; i < lights.length; i++) {
      await sleep(1000);
      lights[i].classList.add('on');
    }

    // Wait random time before lights go out
    await sleep(1000 + Math.random() * 2000);

    lights.forEach(l => l.classList.remove('on'));

    // Vibrate to signal GO
    if (navigator.vibrate) {
      navigator.vibrate(100);
    }

    startTime = performance.now();
    waitingForTap = true;
  }

  function registerReaction() {
    if (waitingForTap) {
      const reaction = performance.now() - startTime;
      document.getElementById('reactionTime').textContent = `✅ Reaction Time: ${reaction.toFixed(0)} ms`;
      waitingForTap = false;

      // Optional: vibrate on tap
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }

      startButton.style.display = 'inline-block';
    }
  }
</script>
</body>
</html>
