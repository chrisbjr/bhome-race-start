<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Race Start Reaction Timer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      position: relative;
      padding: 2vh;
      box-sizing: border-box;
      text-align: center;
    }

    .lights {
      display: flex;
      gap: 3vw;
      margin-top: 4vh;
      margin-bottom: 4vh;
      z-index: 2;
    }

    .light {
      width: 10vw;
      height: 10vw;
      max-width: 60px;
      max-height: 60px;
      min-width: 30px;
      min-height: 30px;
      border-radius: 50%;
      background-color: #440000;
      border: 2px solid #ff0000;
    }

    .light.on {
      background-color: red;
    }

    button {
      font-size: 4vw;
      padding: 2vh 4vw;
      max-width: 90vw;
      z-index: 2;
      margin-top: 1vh;
    }

    #reactionTime {
      font-size: 5vw;
      margin-top: 2vh;
      z-index: 2;
    }

    #throttleButton {
      font-size: 6vw;
      padding: 3vh 8vw;
      background-color: #222;
      color: #0f0;
      border: 2px solid #0f0;
      border-radius: 1em;
      z-index: 2;
      display: none;
    }

    #throttleButton:active {
      background-color: #0f0;
      color: #000;
    }
  </style>
</head>
<body>
<h1 style="z-index: 2; font-size: 6vw;">Race Start Reaction Timer</h1>

<div class="lights" id="lights">
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
</div>

<button id="throttleButton" onclick="registerReaction()" ontouchstart="registerReaction()">Throttle</button>

<div id="reactionTime"></div>
<button id="startButton" onclick="startSequence()">Start</button>

<script>
  const lights = document.querySelectorAll('.light');
  const startButton = document.getElementById('startButton');
  const reactionText = document.getElementById('reactionTime');
  const throttleButton = document.getElementById('throttleButton');

  let startTime = 0;
  let lightsOut = false;
  let gameActive = false;

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function startSequence() {
    startButton.style.display = 'none';
    throttleButton.style.display = 'block';
    reactionText.textContent = '';
    lights.forEach(l => l.classList.remove('on'));

    lightsOut = false;
    gameActive = true;

    for (let i = 0; i < lights.length; i++) {
      await sleep(1000);
      if (!gameActive) return;
      lights[i].classList.add('on');
    }

    await sleep(1000 + Math.random() * 2000);
    if (!gameActive) return;

    lights.forEach(l => l.classList.remove('on'));
    if (navigator.vibrate) navigator.vibrate(100);
    lightsOut = true;
    startTime = performance.now();
  }

  function registerReaction() {
    if (!gameActive) return;

    if (!lightsOut) {
      reactionText.textContent = '❌ False Start!';
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      gameActive = false;
      throttleButton.style.display = 'none';
      setTimeout(() => {
        startButton.style.display = 'inline-block';
      }, 1000);
      return;
    }

    const reaction = performance.now() - startTime;
    reactionText.textContent = `✅ Reaction Time: ${reaction.toFixed(0)} ms`;
    if (navigator.vibrate) navigator.vibrate(50);

    gameActive = false;
    lightsOut = false;
    throttleButton.style.display = 'none';
    setTimeout(() => {
      startButton.style.display = 'inline-block';
    }, 1000);
  }
</script>
</body>
</html>
